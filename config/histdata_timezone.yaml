# Stempelungsregeln der HistData-Rohzeitstempel (scripts/fetch_histdata.py).
#
# Regel (TzRule): Rohzeit (Wanduhr-Ziffern der Datei) - UTC = Offset(zone) + shift_h.
#   kind zone_shift (Default): Offset der Zone im UTC-Zeitpunkt selbst
#        (Rohzeit = Ortszeit in `zone` + shift_h).
#   kind dst_daily_utc: Offset der Zone um 00:00 UTC des UTC-Kalendertags des
#        Zeitpunkts; eine Umstellung wirkt also erst ab der naechsten UTC-Mitternacht.
# Eingebaut (nicht neu definieren):
#   berlin_minus_6_utc_midnight  Europe/Berlin - 6 h, kind dst_daily_utc: UTC-5 im
#        EU-Winter, UTC-4 in der EU-Sommerzeit; Wechsel Mo 00:00 UTC nach dem
#        letzten So im Maerz/Oktober (nicht So 01:00 UTC). Folge in Rohzeit:
#        Herbst  roh So 19:59:59 (23:59:59 UTC) -> roh So 19:00:00 (Mo 00:00 UTC):
#                die Rohstunde So 19:00-19:59:59.999 kommt ZWEIMAL vor (Markt
#                offen); aufgeloest nach Dateireihenfolge am Ruecksprung
#                (davor -4 h, ab ihm -5 h); ohne Ruecksprung -> Quarantaene.
#        Fruehjahr roh So 18:59:59 (23:59:59 UTC) -> roh So 20:00:00 (Mo 00:00 UTC):
#                roh So 19:00-19:59:59.999 existiert NICHT (Tick dort -> Quarantaene).
#   berlin_minus_6  Europe/Berlin - 6 h (zone_shift), Wechsel So 01:00 UTC (v5/v6).
#   ny_local        America/New_York: UTC-5/UTC-4, Wechsel 2. So Maerz 07:00 UTC
#                   und 1. So November 06:00 UTC.
#   fixed_est       Etc/GMT+5 = fest UTC-5 (HistData-Angabe; fuer M1 NICHT verifiziert)
#   undecided       kein Regelname, sondern ein Fahrplan-Eintrag mit candidates
#                   (>= 2 bekannte Regeln): Umrechnung nur, wo alle Kandidaten
#                   dasselbe ergeben; sonst wird der UTC-Monat nicht geschrieben
#                   (Laufreport months_rule_undecided, Exit 4, kein Marker).
#
# Tick-Fahrplan nach dem erweiterten Survey des Owners (Homelab,
# scripts/histdata_tz_survey.py, 2009-2025, XAUUSD und XAGUSD):
#
#   Zeitraum                       Ergebnis
#   2010, 2012, 2015, 2018         ny_local eindeutig (Maerz und Okt/Nov, beide Symbole)
#   2019-03                        ny_local faellt durch; nur berlin_minus_6 und fixed_est
#                                  bestehen, fixed_est ist durch die Juli-Kontrollmonate
#                                  (-4 h) ausgeschlossen -> Berliner Familie
#   2019-10 und jeder Oktober seit Ruecksprung in Dateireihenfolge am EU-Umstellungs-
#                                  SONNTAG roh 19:59:59 -> 19:00:00 (2k-28k echte Ticks je
#                                  Monat, Markt offen) - der Offset wechselt erst Mo
#                                  00:00 UTC -> berlin_minus_6_utc_midnight
#   2021-03, 2024-03               Berliner Familie (ny_local faellt durch); der erwartete
#                                  Vorwaertssprung roh So 18:59:59 -> 20:00:00 wird vom
#                                  Survey (transition_nights) noch an den Daten bestaetigt
#   (Die fruehere Deutung "verirrte Wochenend-Ticks roh Sa 21:00 -> 20:00" war FALSCH.)
#
# Warum der Wechsel ab Rohmonat 2018-12 gesetzt werden kann: ny_local und
# berlin_minus_6_utc_midnight unterscheiden sich nur in zwei Fenstern je Jahr
# (ny_local UTC-4, die Tagesregel UTC-5): Maerz vom US-Beginn (2. So 07:00 UTC)
# bis Mo 00:00 UTC nach dem EU-Beginn, Okt/Nov von Mo 00:00 UTC nach dem EU-Ende
# bis zum US-Ende (1. So Nov 06:00 UTC). Ausserhalb sind beide im Winter UTC-5 und
# im Sommer UTC-4, die Abbildung roh -> UTC ist gleich. Zwischen dem Ende des
# Fensters 2018 (2018-11-04 06:00 UTC, ny_local belegt) und dem Beginn des
# Fensters 2019 (2019-03-10 07:00 UTC, Berliner Familie belegt) liegt KEIN Fenster:
# jede Rohmonatsgrenze 2018-12 .. 2019-03 ist gleichwertig. Fenster (UTC), mit
# zoneinfo auf der Viertelstunde nachgerechnet (keine weiteren Abweichungen):
#
#   Jahr  Maerz (UTC)                  Okt/Nov (UTC)
#   2009  03-08 07:00 .. 03-30 00:00            10-26 00:00 .. 11-01 06:00
#   2010  03-14 07:00 .. 03-29 00:00            11-01 00:00 .. 11-07 06:00
#   2011  03-13 07:00 .. 03-28 00:00            10-31 00:00 .. 11-06 06:00
#   2012  03-11 07:00 .. 03-26 00:00            10-29 00:00 .. 11-04 06:00
#   2013  03-10 07:00 .. 04-01 00:00            10-28 00:00 .. 11-03 06:00
#   2014  03-09 07:00 .. 03-31 00:00            10-27 00:00 .. 11-02 06:00
#   2015  03-08 07:00 .. 03-30 00:00            10-26 00:00 .. 11-01 06:00
#   2016  03-13 07:00 .. 03-28 00:00            10-31 00:00 .. 11-06 06:00
#   2017  03-12 07:00 .. 03-27 00:00            10-30 00:00 .. 11-05 06:00
#   2018  03-11 07:00 .. 03-26 00:00            10-29 00:00 .. 11-04 06:00   <- letzte ny_local
#   2019  03-10 07:00 .. 04-01 00:00            10-28 00:00 .. 11-03 06:00   <- erste berlin
#   2020  03-08 07:00 .. 03-30 00:00            10-26 00:00 .. 11-01 06:00
#   2021  03-14 07:00 .. 03-29 00:00            11-01 00:00 .. 11-07 06:00
#   2022  03-13 07:00 .. 03-28 00:00            10-31 00:00 .. 11-06 06:00
#   2023  03-12 07:00 .. 03-27 00:00            10-30 00:00 .. 11-05 06:00
#   2024  03-10 07:00 .. 04-01 00:00            10-28 00:00 .. 11-03 06:00
#   2025  03-09 07:00 .. 03-31 00:00            10-27 00:00 .. 11-02 06:00
#
# Ein Wechsel an einer Rohmonatsgrenze INNERHALB eines Fensters (zwischen
# Rohmonat 10 und 11; Maerz-Fenster liegen ganz im Rohmaerz, auch wenn sie bis
# 01.04. 00:00 UTC = roh 31.03. 20:00 reichen) waere nicht gleichwertig.
#
# Eigene Regeln (optional), Namen eindeutig, nur a-z 0-9 _:
#   rules:
#     - {name: my_rule, zone: Europe/London, shift_h: -5}
#     - {name: my_daily, zone: Europe/London, shift_h: -5, kind: dst_daily_utc}
#   kind: zone_shift (Default) oder dst_daily_utc; anderes -> Abbruch beim Laden
#
# schedule: je Modus (tick, m1) die Regel ab einem ROH-Monat ("YYYY-MM",
# aufsteigend, keine doppelten Monate). Ein Wechsel gilt nur an
# Rohmonatsgrenzen. Beispiel - ab 2012-01 eine andere Regel:
#   tick:
#     - {from: "2000-01", rule: fixed_est}
#     - {from: "2012-01", rule: berlin_minus_6}
# Nach einer Aenderung: betroffene Store-Dateien werden beim naechsten Lauf
# erkannt (source_timezone passt nicht), verschobene sofort nach metals/stale/
# gelegt und aus dem Roh-Cache neu gebaut. Pruefen vorher offline:
#   python scripts/histdata_tz_survey.py ...   (nutzt evaluate_raw_month)
# Ungueltige Datei (unbekannte Regel/Zone, unsortiert/doppelt, fehlender Modus,
# erster Eintrag nach 2009-02 = Historienbeginn minus 1 Monat) -> Abbruch beim
# Laden, nie still ein Default. Diese Datei muss existieren.
# Andere Datei: Umgebungsvariable HISTDATA_TZ_CONFIG.

rules: []

schedule:
  tick:
    - {from: "2000-01", rule: ny_local}
    - {from: "2018-12", rule: berlin_minus_6_utc_midnight}
  m1:
    - {from: "2000-01", rule: fixed_est}     # M1 unverifiziert: --mode m1 --verify-month 2024-07
